<?xml version="1.0" encoding="UTF-8"?>
<!--
  macOS app icon: the LogSonic "blitz" mark only (no wordmark), inset on the
  Apple icon grid (824x824 content centered in a 1024 canvas, ~100px margin) so
  it sits correctly in the Dock. Source of truth for backend/scripts/app-icon.png.
  Derived from frontend/public/logo.svg (the first 100x100 region: rect + bolt).

  Regenerate the PNG fallback after editing:
    rsvg-convert -w 1024 -h 1024 backend/scripts/app-icon.svg -o backend/scripts/app-icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <g transform="translate(100,100) scale(8.24)">
    <rect width="100" height="100" rx="19" ry="19" fill="#6d5dfc"/>
