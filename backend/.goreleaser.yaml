# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: logsonic

before:
  hooks:
    - go mod tidy
    # `go generate ./...` removed: no //go:generate directives in the tree,
    # and the hook would silently execute arbitrary commands if any dep ever
    # added one. Reinstate explicitly (e.g. `go generate ./pkg/foo`) if needed.
    # Stage LICENSE + README inside backend/ so archives can include them
    # (goreleaser refuses src: paths outside its working dir).
    - cp ../LICENSE LICENSE
    - cp ../README.md README.md

builds:
  # Linux + Windows ship as plain archives (no code-signing needed). darwin is a
  # SEPARATE build id below so it can be excluded from `archives:` — macOS ships
  # only as a signed + notarized + stapled .pkg (and a Homebrew cask), never a
  # bare .tar.gz, because a lone Mach-O can't carry a stapled notarization ticket
  # and trips Gatekeeper on Finder-extracted/offline downloads.
  - id: logsonic
    main: ./
    binary: logsonic
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: logsonic-darwin
    main: ./
    binary: logsonic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Sign each Mach-O binary in place, right after it's built. Use a build
    # post-hook, NOT binary_signs: binary_signs is for *detached* signature files
    # and registers a Signature artifact per binary that goreleaser then tries
    # (and fails) to upload — codesign embeds the signature in the binary itself.
    hooks:
      post:
        - 'scripts/sign-macos.sh "{{ .Path }}"'

universal_binaries:
  - id: logsonic-universal
    ids: [logsonic-darwin]
    replace: false
    name_template: logsonic
    # lipo strips per-arch signatures when merging — re-sign the fat binary.
    # This universal binary is NOT archived; scripts/pkg-macos.sh wraps it into
    # the stapled .pkg that release.sh builds and uploads after notarization.
    hooks:
      post: 'scripts/sign-macos.sh "{{ .Path }}"'

archives:
  - id: default
    # Linux + Windows only. darwin (logsonic-darwin / logsonic-universal) is
    # deliberately excluded — macOS is distributed as a notarized .pkg + cask.
    ids: [logsonic]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# macOS code signing is done in-place via build/universal post-hooks above
# (scripts/sign-macos.sh), so the signed binary is what gets archived. We do NOT
# use a binary_signs/signs block: those are for detached signature files and
# create uploadable Signature artifacts, which breaks publishing when codesign
# embeds the signature in the binary instead of writing a separate file.

# No `brews:` (formula) block. The Homebrew tap ships ONLY a cask named
# `logsonic` (scripts/publish-cask.sh), pointing at the notarized .pkg. With no
# same-named formula, `brew install logsonic` auto-resolves to the cask on macOS
# — no `--cask` flag needed. A formula would shadow the cask and break that, so
# we don't generate one. Linux/Windows users install via the .tar.gz/.zip below
# (or Docker / from source) — there is no Linuxbrew formula anymore.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: logsonic
    name: logsonic
  draft: false
  prerelease: auto
  footer: >-

    ---

    **macOS** (signed + notarized): `brew tap logsonic/logsonic && brew install logsonic`, or download the `.pkg` installer. There is no macOS `.tar.gz` — a bare binary can't carry a stapled notarization ticket and trips Gatekeeper.


    **Linux / Windows**: download the `.tar.gz` / `.zip` for your arch (or use Docker).

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
