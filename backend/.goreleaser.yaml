# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: logsonic

before:
  hooks:
    - go mod tidy
    # `go generate ./...` removed: no //go:generate directives in the tree,
    # and the hook would silently execute arbitrary commands if any dep ever
    # added one. Reinstate explicitly (e.g. `go generate ./pkg/foo`) if needed.
    # Stage LICENSE + README inside backend/ so archives can include them
    # (goreleaser refuses src: paths outside its working dir).
    - cp ../LICENSE LICENSE
    - cp ../README.md README.md

builds:
  - id: logsonic
    main: ./
    binary: logsonic
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Sign each Mach-O binary in place, right after it's built and before it's
    # archived. Use a build post-hook, NOT binary_signs: binary_signs is for
    # *detached* signature files and registers a Signature artifact per binary
    # that goreleaser then tries (and fails) to upload — codesign embeds the
    # signature in the binary itself rather than writing a separate file.
    # scripts/sign-macos.sh skips non-Mach-O targets, so linux/windows pass through.
    hooks:
      post:
        - 'scripts/sign-macos.sh "{{ .Path }}"'

universal_binaries:
  - id: logsonic-universal
    ids: [logsonic]
    replace: false
    name_template: logsonic
    # lipo strips per-arch signatures when merging — re-sign the fat binary.
    hooks:
      post: 'scripts/sign-macos.sh "{{ .Path }}"'

archives:
  - id: default
    ids: [logsonic, logsonic-universal]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}darwin_
        {{- if eq .Arch "all" }}universal
        {{- else }}{{ .Arch }}{{ end }}
      {{- else }}{{ .Os }}_{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# macOS code signing is done in-place via build/universal post-hooks above
# (scripts/sign-macos.sh), so the signed binary is what gets archived. We do NOT
# use a binary_signs/signs block: those are for detached signature files and
# create uploadable Signature artifacts, which breaks publishing when codesign
# embeds the signature in the binary instead of writing a separate file.

# `brews:` is deprecated in goreleaser ≥ 2.10 (favors homebrew_casks), but
# homebrew_casks is macOS-only — formulas work for Linuxbrew too. Revisit if
# we add a .app cask later (RELEASE.md §3).
brews:
  - name: logsonic
    ids: [default]
    repository:
      owner: logsonic
      name: homebrew-logsonic
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/logsonic/logsonic"
    description: "Desktop-first log analytics with full-text search and Grok parsing"
    license: "MIT"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    install: |
      bin.install "logsonic"
    test: |
      assert_match "LogSonic", shell_output("#{bin}/logsonic -help")
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: logsonic
    name: logsonic
  draft: false
  prerelease: auto
  footer: >-

    ---

    **Installing on macOS** (signed + notarized): download the `.tar.gz` for your arch, or `brew install logsonic/logsonic/logsonic`.

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
