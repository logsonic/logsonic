# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: logsonic

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Stage LICENSE + README inside backend/ so archives can include them
    # (goreleaser refuses src: paths outside its working dir).
    - cp ../LICENSE LICENSE
    - cp ../README.md README.md

builds:
  - id: logsonic
    main: ./
    binary: logsonic
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

universal_binaries:
  - id: logsonic-universal
    ids: [logsonic]
    replace: false
    name_template: logsonic
    # lipo strips per-arch signatures when merging — re-sign the fat binary.
    hooks:
      post: 'codesign --force --options=runtime --sign "Developer ID Application: Akash Goswami (CW36P52426)" --timestamp "{{ .Path }}"'

archives:
  - id: default
    ids: [logsonic, logsonic-universal]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}darwin_
        {{- if eq .Arch "all" }}universal
        {{- else }}{{ .Arch }}{{ end }}
      {{- else }}{{ .Os }}_{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Code signing for macOS binaries using Keychain identity.
# binary_signs runs before archives, so the signed binary is what gets packaged.
# (signs: runs post-archive and is for signing the archives/checksums themselves.)
binary_signs:
  - id: logsonic-sign
    ids: [logsonic, logsonic-universal]
    cmd: codesign
    signature: ""
    args:
      - "--force"
      - "--options=runtime"
      - "--sign"
      - "Developer ID Application: Akash Goswami (CW36P52426)"
      - "--timestamp"
      - "${artifact}"

# `brews:` is deprecated in goreleaser ≥ 2.10 (favors homebrew_casks), but
# homebrew_casks is macOS-only — formulas work for Linuxbrew too. Revisit if
# we add a .app cask later (RELEASE.md §3).
brews:
  - name: logsonic
    ids: [default]
    repository:
      owner: logsonic
      name: homebrew-logsonic
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/logsonic/logsonic"
    description: "Desktop-first log analytics with full-text search and Grok parsing"
    license: "MIT"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    install: |
      bin.install "logsonic"
    test: |
      assert_match "LogSonic", shell_output("#{bin}/logsonic -help")
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: logsonic
    name: logsonic
  draft: false
  prerelease: auto
  footer: >-

    ---

    **Installing on macOS** (signed + notarized): download the `.tar.gz` for your arch, or `brew install logsonic/logsonic/logsonic`.

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
